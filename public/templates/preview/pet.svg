<svg xmlns="http://www.w3.org/2000/svg" width="280" height="140" viewBox="0 0 280 140">
  <defs>
    <!-- 柔和阴影 -->
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FF8A65" flood-opacity="0.15"/>
    </filter>
    <!-- 宠物主题渐变 -->
    <linearGradient id="pet-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:0.96"/>
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:0.94"/>
    </linearGradient>
    <!-- 爪印图案 -->
    <pattern id="paw-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="8" r="2" fill="#FFCC80" fill-opacity="0.15"/>
      <circle cx="6" cy="12" r="1.5" fill="#FFCC80" fill-opacity="0.15"/>
      <circle cx="14" cy="12" r="1.5" fill="#FFCC80" fill-opacity="0.15"/>
      <ellipse cx="10" cy="16" rx="3" ry="2.5" fill="#FFCC80" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 主容器 -->
  <rect x="5" y="5" width="270" height="130" rx="24" ry="24"
        fill="url(#pet-gradient)"
        stroke="#FF8A65"
        stroke-width="1.5"
        stroke-opacity="0.35"
        filter="url(#soft-shadow)"/>

  <!-- 装饰图案层 -->
  <rect x="5" y="5" width="270" height="130" rx="24" ry="24"
        fill="url(#paw-pattern)"/>

  <!-- 左侧宠物头像区域 -->
  <g transform="translate(20, 25)">
    <circle cx="22" cy="22" r="20" fill="#FFFFFF" stroke="#FFCC80" stroke-width="2" stroke-opacity="0.4"/>
    <text x="22" y="30" font-family="'Apple Color Emoji', sans-serif" font-size="20" text-anchor="middle">🐱</text>
  </g>

  <!-- 内容区域 -->
  <g transform="translate(70, 30)">
    <!-- 宠物名字和年龄 -->
    <text x="0" y="20" font-family="'SF Pro Display', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#E65100">
      咪咪 · 2岁3个月
    </text>

    <!-- 品种 -->
    <text x="0" y="45" font-family="'SF Pro Display', 'PingFang SC', sans-serif" font-size="13" fill="#FF8A65">
      🐾 英短蓝猫  ·  4.2kg
    </text>

    <!-- 心情/状态 -->
    <text x="0" y="70" font-family="'SF Pro Display', sans-serif" font-size="12" fill="#FFAB91">
      😸 今天心情很好，吃了罐头~
    </text>
  </g>

  <!-- 右下角装饰 -->
  <g transform="translate(230, 85)">
    <circle cx="10" cy="10" r="8" fill="#FFCC80" fill-opacity="0.25"/>
    <circle cx="25" cy="25" r="5" fill="#FFCC80" fill-opacity="0.18"/>
  </g>
</svg>
