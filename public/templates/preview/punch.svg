<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
  <defs>
    <!-- 柔和阴影 -->
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1A1A1A" flood-opacity="0.12"/>
    </filter>
    <!-- 外圈阴影 -->
    <filter id="outer-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C4A484" flood-opacity="0.2"/>
    </filter>
    <!-- 渐变背景 -->
    <linearGradient id="punch-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAF8;stop-opacity:0.98"/>
      <stop offset="100%" style="stop-color:#F5F0E8;stop-opacity:0.95"/>
    </linearGradient>
  </defs>

  <!-- 主圆形印章容器 -->
  <g transform="translate(120, 100)">
    <!-- 外圆环 -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#C4A484" stroke-width="2" stroke-opacity="0.4" filter="url(#outer-shadow)"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#C4A484" stroke-width="1" stroke-opacity="0.25"/>

    <!-- 内圆背景 -->
    <circle cx="0" cy="0" r="84" fill="url(#punch-gradient)" filter="url(#soft-shadow)"/>

    <!-- 装饰虚线圆环 -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="#C4A484" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4,4"/>

    <!-- 顶部装饰 -->
    <g transform="translate(0, -55)">
      <circle cx="0" cy="0" r="8" fill="#7A9E7E" fill-opacity="0.2"/>
      <text x="0" y="3" font-family="'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="10" text-anchor="middle">📍</text>
    </g>

    <!-- 时间大字 -->
    <text x="0" y="5" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="38" font-weight="600" fill="#1A1A1A" text-anchor="middle" letter-spacing="-1">
      09:00
    </text>

    <!-- 打卡类型标签 -->
    <g transform="translate(0, 35)">
      <rect x="-45" y="-10" width="90" height="22" rx="11" fill="#7A9E7E" fill-opacity="0.15"/>
      <text x="0" y="6" font-family="'SF Pro Display', 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#7A9E7E" text-anchor="middle">
        <tspan id="punch-type">上班打卡</tspan>
      </text>
    </g>

    <!-- 地点信息 -->
    <text x="0" y="62" font-family="'SF Pro Display', 'PingFang SC', sans-serif" font-size="11" fill="#8A8A88" text-anchor="middle">
      <tspan id="work-location">北京·三里屯SOHO</tspan>
    </text>

    <!-- 日期 -->
    <text x="0" y="78" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">
      <tspan id="date-weekday">2024.01.15 星期一</tspan>
    </text>
  </g>
</svg>
