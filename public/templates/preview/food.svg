<svg xmlns="http://www.w3.org/2000/svg" width="260" height="150" viewBox="0 0 260 150">
  <defs>
    <!-- 柔和阴影 -->
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#8B4513" flood-opacity="0.15"/>
    </filter>
    <!-- 食物主题渐变 -->
    <linearGradient id="food-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0;stop-opacity:0.96"/>
      <stop offset="100%" style="stop-color:#FFF0E5;stop-opacity:0.94"/>
    </linearGradient>
  </defs>

  <!-- 主容器 - 圆角卡片 -->
  <rect x="5" y="5" width="250" height="140" rx="20" ry="20"
        fill="url(#food-gradient)"
        stroke="#E8A87C"
        stroke-width="1.5"
        stroke-opacity="0.35"
        filter="url(#soft-shadow)"/>

  <!-- 左上角食物图标 -->
  <g transform="translate(20, 20)">
    <circle cx="18" cy="18" r="16" fill="#E8A87C" fill-opacity="0.2"/>
    <text x="18" y="25" font-family="'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="18" text-anchor="middle">🍜</text>
  </g>

  <!-- 内容区域 -->
  <g transform="translate(55, 28)">
    <!-- 餐厅名称 -->
    <text x="0" y="18" font-family="'SF Pro Display', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#5D4037">
      老北京炸酱面馆
    </text>

    <!-- 菜品名称 -->
    <text x="0" y="42" font-family="'SF Pro Display', 'PingFang SC', sans-serif" font-size="13" fill="#8D6E63">
      招牌炸酱面 + 凉拌黄瓜
    </text>

    <!-- 评分和价格 -->
    <text x="0" y="68" font-family="'SF Pro Display', sans-serif" font-size="12" fill="#A1887F">
      ⭐ 4.8  ·  ¥45/人
    </text>

    <!-- 日期 -->
    <text x="0" y="92" font-family="'SF Pro Display', sans-serif" font-size="11" fill="#BCAAA4">
      📅 2024-01-15 晚餐
    </text>
  </g>

  <!-- 右下角装饰 -->
  <g transform="translate(210, 95)">
    <circle cx="12" cy="12" r="10" fill="#E8A87C" fill-opacity="0.15"/>
    <text x="12" y="17" font-family="'Apple Color Emoji', sans-serif" font-size="12" text-anchor="middle">🥢</text>
  </g>
</svg>
