<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="travel-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008000;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:0.9" />
    </linearGradient>
    <filter id="paper-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <rect x="10" y="10" width="300" height="180" rx="12" ry="12" fill="#000000" fill-opacity="0.4" />
  <text x="30" y="45" font-family="Brush Script MT, cursive" font-size="20" fill="#FFFFFF">
    <tspan id="line1" x="30" dy="0">✈️ 旅行日记</tspan>
    <tspan id="line2" x="30" dy="30">📍 上海·迪士尼乐园</tspan>
    <tspan id="line3" x="30" dy="30">☀️ 晴天 22°C</tspan>
    <tspan id="line4" x="30" dy="30">👥 家人</tspan>
    <tspan id="line5" x="30" dy="30">😊 愉快</tspan>
  </text>
  <g transform="translate(260, 50)">
    <circle cx="0" cy="0" r="25" fill="#FFFFFF" fill-opacity="0.2" />
    <path d="M-15,0 Q0,-20 15,0 T-15,0" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <path d="M-15,0 L15,0" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>