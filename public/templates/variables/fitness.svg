<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <!-- 柔和阴影 -->
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2E7D32" flood-opacity="0.15"/>
    </filter>
    <!-- 运动主题渐变 -->
    <linearGradient id="fitness-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:0.96"/>
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:0.94"/>
    </linearGradient>
    <!-- 进度条渐变 -->
    <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#81C784"/>
    </linearGradient>
  </defs>

  <!-- 主容器 -->
  <rect x="5" y="5" width="230" height="150" rx="16" ry="16"
        fill="url(#fitness-gradient)"
        stroke="#4CAF50"
        stroke-width="1.5"
        stroke-opacity="0.3"
        filter="url(#soft-shadow)"/>

  <!-- 顶部图标 -->
  <g transform="translate(20, 18)">
    <circle cx="14" cy="14" r="12" fill="#4CAF50" fill-opacity="0.15"/>
    <text x="14" y="19" font-family="'Apple Color Emoji', sans-serif" font-size="14" text-anchor="middle">{{SPORT_ICON}}</text>
  </g>

  <!-- 运动类型 -->
  <text x="50" y="32" font-family="'SF Pro Display', 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#2E7D32">
    {{SPORT_TYPE}}
  </text>

  <!-- 主要数据 -->
  <g transform="translate(20, 55)">
    <!-- 距离 -->
    <text x="0" y="0" font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="700" fill="#1B5E20">
      {{DISTANCE}}
    </text>
    <text x="70" y="0" font-family="'SF Pro Display', sans-serif" font-size="14" fill="#4CAF50">
      {{DISTANCE_UNIT}}
    </text>

    <!-- 时间和消耗 -->
    <text x="0" y="28" font-family="'SF Pro Display', sans-serif" font-size="13" fill="#388E3C">
      {{DURATION_CALORIES}}
    </text>

    <!-- 配速 -->
    <text x="0" y="52" font-family="'SF Pro Display', sans-serif" font-size="12" fill="#66BB6A">
      {{PACE_STEPS}}
    </text>
  </g>

  <!-- 底部进度条 -->
  <g transform="translate(20, 125)">
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="0" y="0" width="{{PROGRESS_WIDTH}}" height="6" rx="3" fill="url(#progress-gradient)"/>
  </g>

  <!-- 完成度 -->
  <text x="210" y="132" font-family="'SF Pro Display', sans-serif" font-size="10" fill="#4CAF50" text-anchor="end">
    {{PROGRESS_PERCENT}}
  </text>
</svg>
