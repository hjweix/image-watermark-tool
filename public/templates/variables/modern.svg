<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect x="10" y="10" width="280" height="100" rx="10" ry="10" fill="#333333" fill-opacity="0.8" />
  <text x="30" y="45" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" filter="url(#shadow)">
    <tspan id="time" x="30" dy="0">{{TIME_CONTENT}}</tspan>
    <tspan id="date" x="30" dy="30">{{DATE_CONTENT}}</tspan>
    <tspan id="location" x="30" dy="30">{{LOCATION_CONTENT}}</tspan>
  </text>
  <path d="M250 25 L270 25 L260 45 Z" fill="#4CAF50" />
</svg>