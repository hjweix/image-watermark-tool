<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160">
  <defs>
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="2" dy="2" />
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="10" y="10" width="300" height="140" rx="8" ry="8" fill="#FF6B35" fill-opacity="0.9" />
  <text x="160" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF" text-anchor="middle" filter="url(#inner-shadow)">
    <tspan id="line1" x="160" dy="0">{{PUNCH_TYPE_CONTENT}}</tspan>
    <tspan id="line2" x="160" dy="30">{{WORK_LOCATION_CONTENT}}</tspan>
    <tspan id="line3" x="160" dy="30">{{DEPARTMENT_CONTENT}}</tspan>
    <tspan id="line4" x="160" dy="30">{{EMPLOYEE_ID_CONTENT}}</tspan>
    <tspan id="line5" x="160" dy="30">{{DATE_WEEKDAY_CONTENT}}</tspan>
  </text>
  <g transform="translate(40, 45)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" fill-opacity="0.3" />
    <path d="M-5,-10 L-5,10 L10,0 Z" fill="#FFFFFF" />
  </g>
  <g transform="translate(280, 45)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" fill-opacity="0.3" />
    <path d="M-5,-10 L-5,10 L10,0 Z" fill="#FFFFFF" />
  </g>
</svg>